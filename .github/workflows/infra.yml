name: infra

# scripts/ is listed because Terraform loads those files into the Mongo VM metadata
on:
  pull_request:
    paths: ["infra/**", "scripts/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "scripts/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail, so a failing command in a pipeline
# (e.g. terraform plan | tee) fails the step instead of taking the last command's exit code
defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Misconfiguration scan (Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-config.sarif
          limit-severities-for-sarif: true

      # Each scan has its own category so its alerts are tracked separately. A report is missing
      # when an earlier step failed and skipped the scan that writes it.
      - name: Upload misconfiguration scan results
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: secret
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-secret.sarif
          limit-severities-for-sarif: true

      - name: Upload secret scan results
        if: always() && hashFiles('trivy-secret.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-secret

  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_IAC }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - run: terraform -chdir=infra fmt -check -diff
      - run: terraform -chdir=infra init
      - run: terraform -chdir=infra validate
      - name: Plan
        run: terraform -chdir=infra plan -lock=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on the pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            const body = "### Terraform plan\n```\n" + plan + "\n```";
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body });

  # Main runs plan before the production approval and publish that plan in the run summary.
  # The binary plan holds a copy of the state, so it goes to the private state bucket rather
  # than a workflow artifact. Apply runs only that file, after checking its SHA-256.
  plan-main:
    name: Plan (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_BUCKET: clgcporg10-178-tfstate
    outputs:
      plan_uri: ${{ steps.store.outputs.plan_uri }}
      plan_sha256: ${{ steps.store.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_IAC }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - run: terraform -chdir=infra init
      - name: Plan
        run: terraform -chdir=infra plan -no-color -out=tfplan | tee plan.txt

      - name: Store plan for approval
        id: store
        run: |
          uri="gs://$PLAN_BUCKET/plans/$GITHUB_RUN_ID/tfplan"
          sum=$(sha256sum infra/tfplan | cut -d' ' -f1)
          gcloud storage cp infra/tfplan "$uri"
          echo "plan_uri=$uri" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=$sum" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan for ${GITHUB_SHA::7}"
            echo "Approving \`production\` applies this plan file only (SHA-256 \`$sum\`)."
            echo "Terraform rejects it if the state changed after it was created."
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan-main
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_URI: ${{ needs.plan-main.outputs.plan_uri }}
      PLAN_SHA256: ${{ needs.plan-main.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_IAC }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - run: terraform -chdir=infra init

      - name: Fetch the approved plan
        run: |
          gcloud storage cp "$PLAN_URI" infra/tfplan
          echo "$PLAN_SHA256  infra/tfplan" | sha256sum --check --strict

      - run: terraform -chdir=infra apply -no-color tfplan

      # Removes every stored version, so applied plans don't accumulate in the versioned bucket
      - name: Delete the stored plan
        run: gcloud storage rm --all-versions "$PLAN_URI"
